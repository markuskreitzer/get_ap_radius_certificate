[project]
name = "get_ap_radius_certificate"
version = "0.1.0"
description = "A Python tool to retrieve RADIUS server certificates from WPA2/WPA3 Enterprise wireless networks"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
dependencies = [
    "scapy>=2.5.0",
]

[project.urls]
Homepage = "https://github.com/markuskreitzer/get_ap_radius_certificate"
Repository = "https://github.com/markuskreitzer/get_ap_radius_certificate"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []
